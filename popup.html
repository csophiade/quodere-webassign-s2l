<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 230px; height: 230px; box-sizing: border-box; padding: 16px; background: #16181d; color: #e9ebf0;
         font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  #state { font-size: 20px; font-weight: 600; }
  .switch { position: relative; width: 52px; height: 30px; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .track { position: absolute; inset: 0; background: #3a3f4b; border-radius: 15px; transition: background .15s; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: #fff;
                  border-radius: 50%; transition: transform .15s; }
  input:checked + .track { background: #2fbf71; }
  input:checked + .track::after { transform: translateX(22px); }
  input:focus-visible + .track { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .hint { margin-top: 12px; color: #a3a9b6; }
  kbd { background: #2a2e37; border: 1px solid #454b58; border-radius: 4px; padding: 0 6px; color: #fff; font: inherit; }
  .last { margin-top: auto; border-top: 1px solid #2a2e37; padding-top: 10px; min-height: 48px; }
  .label { color: #7d8494; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #out { font: 14px ui-monospace, Menlo, monospace; word-break: break-all; }
  #heard { color: #a3a9b6; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <h1>WebAssign Voice Answer</h1>
  <div class="row">
    <span id="state">On</span>
    <label class="switch"><input id="toggle" type="checkbox" aria-label="Voice answer on or off"><span class="track"></span></label>
  </div>
  <div class="hint" id="hint">Click an answer box, press <kbd>,</kbd> and speak. Say "comma" for a real comma.</div>
  <div class="last">
    <div class="label">Last answer</div>
    <div id="out">-</div>
    <div id="heard"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
